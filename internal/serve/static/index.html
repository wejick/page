<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Static pages — manage</title>
<link rel="stylesheet" href="/ui/app.css">
<!-- app.js registers the page component on alpine:init, so it must load
     before Alpine itself (harden-admin-ui D1/D2). -->
<script defer src="/ui/app.js"></script>
<script defer src="/ui/alpine.csp-3.17.4.min.js"></script>
</head>
<body x-data="page" data-auth-mode="token">
<header>
  <h1><a href="#/">Static pages</a></h1>
  <span class="spacer"></span>
  <button id="themebtn" class="chip" type="button" @click="cycleTheme"
          x-text="themeLabel" aria-label="Toggle color theme"></button>
  <!-- Token entry is collapsed to a header chip; the input row only opens
       on demand or when auth actually fails (polish-admin-ui D5). The chip
       exists only in token mode: none mode needs no credentials, and oidc
       mode's browser flow redirects to /login instead (auth-modes D8). -->
  <button id="tokenchip" class="chip" type="button" x-show="showChip"
          :class="{ warn: !tokenSet }" @click="toggleAuth"
          x-text="chipLabel"></button>
  <a class="btn" href="#/upload">+ Upload</a>
</header>

<div id="authrow" x-show="showAuth" x-cloak>
  <label for="token">API token</label>
  <input type="text" id="token" placeholder="bearer token" autocomplete="off"
         :value="tokenInput" @input="onTokenInput">
  <span id="authmsg" x-text="authMsg"></span>
</div>
<div id="flash" x-show="flashMsg" x-text="flashMsg" x-cloak></div>
<main id="view" x-cloak>

<template x-if="route === 'list'">
  <div>
    <p class="listhead">
      <label for="statusfilter">Status</label>
      <select id="statusfilter" @change="onStatusChange">
        <option value="">all</option>
        <option value="live">live</option>
        <option value="parked">parked</option>
        <option value="parking">parking</option>
        <option value="unparking">unparking</option>
        <option value="deleting">deleting</option>
      </select>
    </p>
    <p class="muted" x-show="listLoading">Loading…</p>
    <p class="err" x-show="listError" x-text="listError"></p>
    <template x-if="listLoaded && !listError">
      <div>
        <div class="tablewrap">
        <table>
          <thead><tr><th>Page</th><th>Status</th><th class="num">Size</th>
            <th class="num">Assets</th><th>Created</th><th></th></tr></thead>
          <tbody>
            <template x-for="p in listPages" :key="p.slug">
              <tr>
                <td><a :href="p.listHref" x-text="p.slug"></a>
                    <div class="muted" x-show="p.identShown" x-text="p.identifier"></div></td>
                <td><span :class="p.badgeClass" x-text="p.badgeLabel"></span></td>
                <td class="num" x-text="p.size"></td>
                <td class="num" x-text="p.assetCount"></td>
                <!-- relTime renders the relative duration with the absolute
                     datetime as the hover tooltip; times go stale on a
                     long-lived view but every mutation re-renders (D6). -->
                <td><span :title="p.abs" x-text="p.rel"></span></td>
                <td class="actions">
                  <a class="btn" x-show="p.canOpen" :href="p.url" target="_blank">Open</a>
                  <button class="btn" x-show="p.canPark" :disabled="p.busy"
                          @click="pageAction(p, 'park')">Park</button>
                  <button class="btn" x-show="p.canUnpark" :disabled="p.busy"
                          @click="pageAction(p, 'unpark')">Unpark</button>
                  <button class="btn danger" x-show="p.canDelete" :disabled="p.busy"
                          @click="pageAction(p, 'delete')">Delete</button>
                </td>
              </tr>
            </template>
            <tr x-show="listEmptyFiltered">
              <td colspan="6" class="muted">No pages with this status.</td></tr>
            <tr x-show="listEmptyAll">
              <td colspan="6"><a class="btn" href="#/upload">+ Upload your first page</a></td></tr>
          </tbody>
        </table>
        </div>
        <nav class="pager">
          <button class="btn" :disabled="prevDisabled" @click="prevPage">‹ Prev</button>
          <button class="btn" :disabled="nextDisabled" @click="nextPage">Next ›</button>
          <span class="muted" x-text="listRange"></span>
        </nav>
      </div>
    </template>
  </div>
</template>

<template x-if="route === 'detail'">
  <div>
    <p class="muted" x-show="detailLoading">Loading…</p>
    <template x-if="detailError">
      <div>
        <p class="err" x-text="detailError"></p>
        <p><a href="#/">← Back to list</a></p>
      </div>
    </template>
    <template x-if="detail">
      <div>
        <p><a href="#/">← Back to list</a></p>
        <h2 class="detail-title" x-text="detail.slug"></h2>
        <p>
          <span :class="detail.badgeClass" x-text="detail.badgeLabel"></span>
          <span x-show="detail.canOpen"> ·
            <a :href="detail.url" target="_blank" x-text="detail.openLabel"></a></span>
          <span x-show="detail.parked"> · page is parked and not being served</span>
        </p>
        <dl class="meta">
          <dt>Identifier</dt><dd x-text="detail.identifier"></dd>
          <dt>Created</dt><dd><span :title="detail.createdAbs" x-text="detail.createdRel"></span></dd>
          <dt>Total size</dt><dd x-text="detail.sizeLine"></dd>
        </dl>
        <p>
          <button class="btn" x-show="detail.canPark" :disabled="detail.busy"
                  @click="pageAction(detail, 'park')">Park</button>
          <button class="btn" x-show="detail.canUnpark" :disabled="detail.busy"
                  @click="pageAction(detail, 'unpark')">Unpark</button>
          <button class="btn danger" x-show="detail.canDelete" :disabled="detail.busy"
                  @click="pageAction(detail, 'delete')">Delete</button>
          <span class="muted" x-show="detail.isTransient">A transition is in progress for this page.</span>
        </p>
        <h3>Manifest</h3>
        <div class="tablewrap">
        <table>
          <thead><tr><th>Path</th><th>Storage</th><th>Type</th><th class="num">Size</th><th>Source</th></tr></thead>
          <tbody>
            <template x-for="a in detail.assets" :key="a.path">
              <tr>
                <td x-text="a.path"></td>
                <td><span :class="a.badgeClass" x-text="a.badgeLabel"></span></td>
                <td x-text="a.contentType"></td>
                <td class="num" x-text="a.size"></td>
                <td class="muted" x-text="a.sourceURL"></td>
              </tr>
            </template>
            <tr x-show="!detail.assets.length">
              <td colspan="5" class="muted">No assets.</td></tr>
          </tbody>
        </table>
        </div>
        <!-- kept-external is the accepted-compromise status: it must read as
             a risk, not as a settled state (D3). -->
        <p class="note" x-show="detail.note" x-text="detail.note"></p>
      </div>
    </template>
  </div>
</template>

<template x-if="route === 'upload'">
  <div>
    <h2>Publish new page</h2>
    <!-- One-surface source card (one-surface-upload-ui D1): a drop layer
         spanning the card and a URL footer, with last-action-wins selection
         (D2) — the card always shows the single source Publish sends, so
         the "not both" error state is unreachable and the server's 422
         stays as the backstop. The drop handler covers the whole card, so
         a file dropped on the URL input area still lands as the file
         source (D3). -->
    <div class="srccard" @dragenter.prevent="dragOver = true"
         @dragover.prevent @dragleave.prevent="dragOver = false"
         @drop.prevent="onDrop($event)">
      <label class="drop" :class="dropClass" for="file">
        <input type="file" id="file" class="visually-hidden"
               accept=".html,.htm,.zip" @change="onFilePicked">
        <template x-if="!hasSource">
          <div class="dropempty">
            <div class="icon">📄</div>
            <div class="big">Drop your page here</div>
            <div class="sub">an HTML file or a zip pack — or click to browse</div>
          </div>
        </template>
        <template x-if="hasSource">
          <div class="source">
            <span>✓</span>
            <span class="name" x-text="srcName"></span>
            <span class="size" x-show="srcSize" x-text="srcSize"></span>
            <button class="clear" type="button" title="clear"
                    @click="clearSource">✕</button>
          </div>
        </template>
      </label>
      <div class="footer" :class="footerClass">
        <div class="row">
          <span class="link">🔗</span>
          <input type="text" id="srcurl" placeholder="or paste a link…"
                 autocomplete="off" :value="urlInput" @input="onURLInput">
        </div>
      </div>
    </div>
    <div class="below">
      <label for="identifier">Identifier</label>
      <input type="text" id="identifier" placeholder="landing-page"
             autocomplete="off" :value="ident" @input="onIdentInput">
      <div class="preview">
        <span class="warn" x-show="identReservedMsg" x-text="identReservedMsg"></span>
        <span x-show="identPreviewURL">will be published at
          <code x-text="identPreviewURL"></code></span>
      </div>
      <div class="ferr" x-show="identError">Identifier is required.</div>
      <button id="go" class="btn primary" :disabled="publishing"
              @click="publish" x-text="publishLabel">Publish</button>
    </div>
    <template x-if="result">
      <div class="resultbox" :class="result.ok ? 'ok' : 'err'">
        <template x-if="result.ok">
          <div>
            Published: <a :href="result.url" target="_blank" x-text="result.slug"></a>
            — <a :href="result.detailHref">details</a>
            <!-- The 201 response carries the ingest counts (upload.go);
                 surface them here so kept-external doesn't hide until
                 someone opens the detail view (D8). -->
            <div class="sum" :class="{ warn: result.summaryWarn }"
                 x-show="result.summary">Assets: <span x-text="result.summary"></span></div>
          </div>
        </template>
        <template x-if="!result.ok">
          <div>
            <span x-text="result.message"></span>
            <!-- The strict gate: show which assets failed and the way out
                 (import-by-url D5). -->
            <template x-if="result.incomplete">
              <ul class="unresolved">
                <template x-for="u in result.unresolved" :key="u.url">
                  <li><code x-text="u.url"></code> — <span x-text="u.reason"></span></li>
                </template>
              </ul>
            </template>
          </div>
        </template>
      </div>
    </template>
  </div>
</template>

</main>
</body>
</html>
